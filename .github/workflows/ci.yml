name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: ninjatech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ninjatech_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NINJATECH_ENVIRONMENT: test
      NINJATECH_LOG_LEVEL: INFO
      NINJATECH_DATABASE_URL: postgresql+asyncpg://postgres:ci-only-not-a-secret@127.0.0.1:5432/ninjatech_test
      NINJATECH_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-only-not-a-secret@127.0.0.1:5432/ninjatech_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.22

      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src tests

      - name: Verify migration round trip
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Test
        run: uv run pytest

  container-smoke:
    name: API and worker container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run container smoke test
        run: make container-smoke
