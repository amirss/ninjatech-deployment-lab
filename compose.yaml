services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ninjatech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ninjatech}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    environment:
      NINJATECH_APP_NAME: ${NINJATECH_APP_NAME:-NinjaTech Deployment Lab}
      NINJATECH_ENVIRONMENT: ${NINJATECH_ENVIRONMENT:-development}
      NINJATECH_LOG_LEVEL: ${NINJATECH_LOG_LEVEL:-INFO}
      NINJATECH_DB_READY_TIMEOUT_SECONDS: ${NINJATECH_DB_READY_TIMEOUT_SECONDS:-2.0}
      NINJATECH_WORKER_DEFAULT_MAX_ATTEMPTS: ${NINJATECH_WORKER_DEFAULT_MAX_ATTEMPTS:-3}
      NINJATECH_DATABASE_URL: ${NINJATECH_DATABASE_URL:?Set NINJATECH_DATABASE_URL in .env}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      - db

  worker:
    build:
      context: .
    command: ["python", "-m", "ninjatech_deployment_lab.worker"]
    environment:
      NINJATECH_APP_NAME: ${NINJATECH_APP_NAME:-NinjaTech Deployment Lab}
      NINJATECH_ENVIRONMENT: ${NINJATECH_ENVIRONMENT:-development}
      NINJATECH_LOG_LEVEL: ${NINJATECH_LOG_LEVEL:-INFO}
      NINJATECH_DATABASE_URL: ${NINJATECH_DATABASE_URL:?Set NINJATECH_DATABASE_URL in .env}
      NINJATECH_WORKER_POLL_INTERVAL_SECONDS: ${NINJATECH_WORKER_POLL_INTERVAL_SECONDS:-1.0}
      NINJATECH_WORKER_LEASE_DURATION_SECONDS: ${NINJATECH_WORKER_LEASE_DURATION_SECONDS:-30.0}
      NINJATECH_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${NINJATECH_WORKER_HEARTBEAT_INTERVAL_SECONDS:-10.0}
      NINJATECH_WORKER_HANDLER_TIMEOUT_SECONDS: ${NINJATECH_WORKER_HANDLER_TIMEOUT_SECONDS:-300.0}
      NINJATECH_WORKER_SHUTDOWN_GRACE_SECONDS: ${NINJATECH_WORKER_SHUTDOWN_GRACE_SECONDS:-20.0}
      NINJATECH_WORKER_DEFAULT_MAX_ATTEMPTS: ${NINJATECH_WORKER_DEFAULT_MAX_ATTEMPTS:-3}
      NINJATECH_WORKER_RETRY_BASE_SECONDS: ${NINJATECH_WORKER_RETRY_BASE_SECONDS:-2.0}
      NINJATECH_WORKER_RETRY_CAP_SECONDS: ${NINJATECH_WORKER_RETRY_CAP_SECONDS:-300.0}
      NINJATECH_WORKER_MAX_RESULT_BYTES: ${NINJATECH_WORKER_MAX_RESULT_BYTES:-262144}
      NINJATECH_ENABLE_DIAGNOSTIC_HANDLER: ${NINJATECH_ENABLE_DIAGNOSTIC_HANDLER:-false}
      NINJATECH_ENABLE_DEPLOYMENT_CONTEXT_SYNC: ${NINJATECH_ENABLE_DEPLOYMENT_CONTEXT_SYNC:-false}
      NINJATECH_DEPLOYMENT_SCOPE_ID: ${NINJATECH_DEPLOYMENT_SCOPE_ID:-local-disabled}
      NINJATECH_DEPLOYMENT_ALLOWED_SERVICE_IDS: ${NINJATECH_DEPLOYMENT_ALLOWED_SERVICE_IDS:-[]}
      NINJATECH_DEPLOYMENT_ALLOWED_GITHUB_REPOSITORIES: ${NINJATECH_DEPLOYMENT_ALLOWED_GITHUB_REPOSITORIES:-[]}
      NINJATECH_DEPLOYMENT_ALLOWED_JIRA_PROJECTS: ${NINJATECH_DEPLOYMENT_ALLOWED_JIRA_PROJECTS:-[]}
      NINJATECH_DEPLOYMENT_MINIMUM_POLICY_VERSION: ${NINJATECH_DEPLOYMENT_MINIMUM_POLICY_VERSION:-1}
      NINJATECH_SERVICE_CATALOG_BASE_URL: ${NINJATECH_SERVICE_CATALOG_BASE_URL:-http://127.0.0.1:8090/catalog}
      NINJATECH_JIRA_BASE_URL: ${NINJATECH_JIRA_BASE_URL:-http://127.0.0.1:8090/jira}
      NINJATECH_GITHUB_BASE_URL: ${NINJATECH_GITHUB_BASE_URL:-http://127.0.0.1:8090/github}
      NINJATECH_GITHUB_EXPECTED_LOGIN: ${NINJATECH_GITHUB_EXPECTED_LOGIN:-}
      NINJATECH_ENABLE_SLACK_NOTIFICATION: ${NINJATECH_ENABLE_SLACK_NOTIFICATION:-false}
      NINJATECH_SLACK_BASE_URL: ${NINJATECH_SLACK_BASE_URL:-http://127.0.0.1:8090/slack}
      NINJATECH_SLACK_BOT_TOKEN: ${NINJATECH_SLACK_BOT_TOKEN:-}
      NINJATECH_SLACK_EXPECTED_TEAM_ID: ${NINJATECH_SLACK_EXPECTED_TEAM_ID:-}
      NINJATECH_SLACK_EXPECTED_USER_ID: ${NINJATECH_SLACK_EXPECTED_USER_ID:-}
      NINJATECH_SLACK_EXPECTED_BOT_ID: ${NINJATECH_SLACK_EXPECTED_BOT_ID:-}
      NINJATECH_DEPLOYMENT_ALLOWED_SLACK_CHANNELS: ${NINJATECH_DEPLOYMENT_ALLOWED_SLACK_CHANNELS:-[]}
      NINJATECH_SLACK_MAX_TEXT_CHARS: ${NINJATECH_SLACK_MAX_TEXT_CHARS:-1000}
      NINJATECH_SLACK_WRITE_TIMEOUT_SECONDS: ${NINJATECH_SLACK_WRITE_TIMEOUT_SECONDS:-5.0}
      NINJATECH_SERVICE_CATALOG_TOKEN: ${NINJATECH_SERVICE_CATALOG_TOKEN:-}
      NINJATECH_JIRA_API_TOKEN: ${NINJATECH_JIRA_API_TOKEN:-}
      NINJATECH_GITHUB_TOKEN: ${NINJATECH_GITHUB_TOKEN:-}
      NINJATECH_INTEGRATION_PROVIDER_WRITE_TIMEOUT_SECONDS: ${NINJATECH_INTEGRATION_PROVIDER_WRITE_TIMEOUT_SECONDS:-8.0}
      NINJATECH_INTEGRATION_SETTLEMENT_DELAY_SECONDS: ${NINJATECH_INTEGRATION_SETTLEMENT_DELAY_SECONDS:-3.0}
    depends_on:
      - db
    healthcheck:
      disable: true
    stop_grace_period: 25s

  simulator:
    build:
      context: .
    command:
      - uvicorn
      - ninjatech_deployment_lab.simulator.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    profiles:
      - integration
    environment:
      NINJATECH_ENVIRONMENT: ${NINJATECH_ENVIRONMENT:-development}
      SIMULATOR_ACCEPT_DELAY_SECONDS: ${SIMULATOR_ACCEPT_DELAY_SECONDS:-2.0}
      SIMULATOR_DELAYED_RESPONSE_SECONDS: ${SIMULATOR_DELAYED_RESPONSE_SECONDS:-10.0}
      SIMULATOR_SLACK_RESPONSE_DELAY_SECONDS: ${SIMULATOR_SLACK_RESPONSE_DELAY_SECONDS:-10.0}
    ports:
      - "${SIMULATOR_PORT:-18090}:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"
      interval: 1s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
