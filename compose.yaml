services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ninjatech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ninjatech}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    environment:
      NINJATECH_APP_NAME: ${NINJATECH_APP_NAME:-NinjaTech Deployment Lab}
      NINJATECH_ENVIRONMENT: ${NINJATECH_ENVIRONMENT:-development}
      NINJATECH_LOG_LEVEL: ${NINJATECH_LOG_LEVEL:-INFO}
      NINJATECH_DB_READY_TIMEOUT_SECONDS: ${NINJATECH_DB_READY_TIMEOUT_SECONDS:-2.0}
      NINJATECH_WORKER_DEFAULT_MAX_ATTEMPTS: ${NINJATECH_WORKER_DEFAULT_MAX_ATTEMPTS:-3}
      NINJATECH_DATABASE_URL: ${NINJATECH_DATABASE_URL:?Set NINJATECH_DATABASE_URL in .env}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      - db

  worker:
    build:
      context: .
    command: ["python", "-m", "ninjatech_deployment_lab.worker"]
    environment:
      NINJATECH_APP_NAME: ${NINJATECH_APP_NAME:-NinjaTech Deployment Lab}
      NINJATECH_ENVIRONMENT: ${NINJATECH_ENVIRONMENT:-development}
      NINJATECH_LOG_LEVEL: ${NINJATECH_LOG_LEVEL:-INFO}
      NINJATECH_DATABASE_URL: ${NINJATECH_DATABASE_URL:?Set NINJATECH_DATABASE_URL in .env}
      NINJATECH_WORKER_POLL_INTERVAL_SECONDS: ${NINJATECH_WORKER_POLL_INTERVAL_SECONDS:-1.0}
      NINJATECH_WORKER_LEASE_DURATION_SECONDS: ${NINJATECH_WORKER_LEASE_DURATION_SECONDS:-30.0}
      NINJATECH_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${NINJATECH_WORKER_HEARTBEAT_INTERVAL_SECONDS:-10.0}
      NINJATECH_WORKER_HANDLER_TIMEOUT_SECONDS: ${NINJATECH_WORKER_HANDLER_TIMEOUT_SECONDS:-300.0}
      NINJATECH_WORKER_SHUTDOWN_GRACE_SECONDS: ${NINJATECH_WORKER_SHUTDOWN_GRACE_SECONDS:-20.0}
      NINJATECH_WORKER_DEFAULT_MAX_ATTEMPTS: ${NINJATECH_WORKER_DEFAULT_MAX_ATTEMPTS:-3}
      NINJATECH_WORKER_RETRY_BASE_SECONDS: ${NINJATECH_WORKER_RETRY_BASE_SECONDS:-2.0}
      NINJATECH_WORKER_RETRY_CAP_SECONDS: ${NINJATECH_WORKER_RETRY_CAP_SECONDS:-300.0}
      NINJATECH_WORKER_MAX_RESULT_BYTES: ${NINJATECH_WORKER_MAX_RESULT_BYTES:-262144}
      NINJATECH_ENABLE_DIAGNOSTIC_HANDLER: ${NINJATECH_ENABLE_DIAGNOSTIC_HANDLER:-false}
    depends_on:
      - db
    healthcheck:
      disable: true
    stop_grace_period: 25s

volumes:
  postgres-data:
